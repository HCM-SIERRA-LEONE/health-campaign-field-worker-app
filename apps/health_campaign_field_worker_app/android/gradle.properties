org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=anim,bcprov
# Suppress JVM target mismatch between Java (1.8) and Kotlin (varies)
kotlin.jvm.target.validation.mode=IGNORE
# Disable build cache to prevent orphaned partial cache entries on failed builds
org.gradle.caching=false